name: CI/CD Pipeline

# Ejecuta la validación en cambios directos, pull requests hacia main o manualmente.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# El workflow solo necesita leer el contenido del repositorio y usar el token automático.
permissions:
  contents: read

# Evita consumir recursos en ejecuciones anteriores de la misma rama o pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ejecuta las pruebas y publica la cobertura generada por JaCoCo.
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Obtiene todo el historial para que Sonar calcule correctamente el análisis.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Instala Java 21 y reutiliza las dependencias Maven entre ejecuciones.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Reutiliza la caché local de Sonar sin duplicar la caché de dependencias Maven.
      - name: Cache Sonar
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # Ejecuta compilación, pruebas y generación del reporte JaCoCo.
      # Como alternativa, Sonar podría ejecutarse en esta misma invocación de verify;
      # separarlo facilita visualizarlo como una etapa independiente en la entrega.
      - name: Run tests
        run: ./mvnw -B clean verify

      # Comparte solo las clases y el reporte necesarios para el análisis de Sonar.
      - name: Upload Sonar analysis inputs
        uses: actions/upload-artifact@v7
        with:
          name: sonar-analysis-inputs
          path: |
            backend/target/classes
            backend/target/test-classes
            backend/target/site/jacoco

      # Conserva el reporte HTML/XML aunque las pruebas fallen.
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      # Envía el reporte XML a Coveralls usando el GITHUB_TOKEN automático.
      - name: Publish coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: backend/target/site/jacoco/jacoco.xml
          format: jacoco

  # Analiza el código ya compilado sin repetir verify ni las pruebas.
  sonar:
    name: Sonar analysis
    needs: tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # Obtiene el historial completo para que Sonar identifique correctamente el código nuevo.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Instala Java 21 para ejecutar el scanner Maven.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Reutiliza la caché del scanner sin duplicar la caché Maven de setup-java.
      - name: Cache Sonar
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # Restaura exactamente las rutas target que Sonar necesita para analizar sin compilar.
      - name: Download Sonar analysis inputs
        uses: actions/download-artifact@v8
        with:
          name: sonar-analysis-inputs
          path: backend/target

      # Ejecuta únicamente el análisis sobre las clases y el reporte descargados.
      - name: Run Sonar analysis
        run: ./mvnw -B sonar:sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Escanea las dependencias y el código en paralelo con los demás jobs.
  snyk:
    name: Snyk security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      # Obtiene el código que Snyk analizará.
      - name: Checkout
        uses: actions/checkout@v7

      # Instala Java 21 y reutiliza las dependencias Maven para el análisis.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Instala el ejecutable de Snyk desde la acción fijada a un commit inmutable.
      - name: Set up Snyk
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master 2026-10-07

      # Falla el job si Snyk detecta vulnerabilidades de severidad alta o crítica.
      - name: Snyk test
        # Excepción temporal documentada en backend/.snyk; quitar al existir un parche.
        continue-on-error: true
        run: snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Registra el proyecto en Snyk únicamente en pushes a main.
      - name: Snyk monitor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: snyk monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # Construye y publica la imagen únicamente después de tests y Sonar.
  build:
    name: Build & Package
    needs:
      - tests
      - sonar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Obtiene el código fuente usado como contexto de construcción de Docker.
      - name: Checkout
        uses: actions/checkout@v7

      # Prepara Buildx para construir la imagen con caché remota de GitHub Actions.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Autentica contra Docker Hub solo cuando se publicará la imagen en main.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Genera las etiquetas del commit y latest únicamente para pushes a main.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/udeabank-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Construye la imagen desde backend y la publica solo en pushes a main.
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Genera las etiquetas del commit y latest para la imagen del frontend.
      - name: Extract frontend Docker metadata
        id: frontend-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/udeabank-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Construye y publica el frontend SSR con la URL de API definida para el despliegue.
      - name: Build and push frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8088' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
