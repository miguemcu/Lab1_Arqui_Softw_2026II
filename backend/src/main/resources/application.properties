spring.application.name=lab1_arqsw
server.port=8088

# DB (MySQL)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:udeabank}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# En esta versión de Hibernate ya no se necesita definir el dialecto
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tiempo máximo para transacciones y rollback en caso de fallo
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# Formato de contenido requests y responses
spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.favor-parameter=false
spring.mvc.contentnegotiation.favor-path-extension=false

# (CORS) Autorización para que el front consulte al back (docker, local)
app.cors.allowed-origins=http://localhost:3000,http://localhost:8080
